name: Binary package CI and release

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*.*.*"]

concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --loglevel error
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  validate-target:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: metadata
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            directory: linux-x64
            executable: wfc
          - runner: ubuntu-24.04-arm
            directory: linux-arm64
            executable: wfc
          - runner: macos-14
            directory: darwin-arm64
            executable: wfc
          - runner: windows-latest
            directory: win32-x64
            executable: wfc.exe
          - runner: windows-11-arm
            directory: win32-arm64
            executable: wfc.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate, pack, install, and smoke test native package
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${VERSION#v}"
          node scripts/validate-release.ts "$version"
          cd "packages/${{ matrix.directory }}"
          local_version="$("bin/${{ matrix.executable }}" --version)"
          if [[ "$local_version" != "$version" ]]; then
            echo "::error::Bundled executable version $local_version does not match $version."
            exit 1
          fi
          tarball="$(npm pack --silent)"
          consumer_directory="$(mktemp -d)"
          npm install --ignore-scripts --prefix "$consumer_directory" "$PWD/$tarball"
          installed_version="$("$consumer_directory/node_modules/@vx.rs/webfont-converter-bin-${{ matrix.directory }}/bin/${{ matrix.executable }}" --version)"
          if [[ "$installed_version" != "$version" ]]; then
            echo "::error::Installed executable version $installed_version does not match $version."
            exit 1
          fi

  validate-wasi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: metadata
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate and pack WASI compatibility fallback
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${VERSION#v}"
          node scripts/validate-release.ts "$version"
          cd packages/wasi
          npm pack --silent

  publish-targets-and-dispatch:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate-target, validate-wasi]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Confirm every target version is unpublished
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${VERSION#v}"
          for package_name in \
            @vx.rs/webfont-converter-bin-linux-x64 \
            @vx.rs/webfont-converter-bin-linux-arm64 \
            @vx.rs/webfont-converter-bin-darwin-arm64 \
            @vx.rs/webfont-converter-bin-win32-x64 \
            @vx.rs/webfont-converter-bin-win32-arm64 \
            @vx.rs/webfont-converter-wasi; do
            set +e
            npm_view_output="$(npm view "$package_name@$version" version --registry=https://registry.npmjs.org 2>&1)"
            npm_view_status=$?
            set -e

            if [[ $npm_view_status -eq 0 ]]; then
              echo "::error::$package_name@$version is already published."
              exit 1
            fi
            if [[ "$npm_view_output" != *"E404"* ]]; then
              echo "$npm_view_output"
              echo "::error::Unable to confirm that $package_name@$version is unpublished."
              exit 1
            fi
          done
      - name: Publish all stable target packages with trusted publishing
        shell: bash
        run: |
          for target in linux-x64 linux-arm64 darwin-arm64 win32-x64 win32-arm64 wasi; do
            pushd "packages/$target"
            npm publish --provenance --access public
            popd
          done
      - name: Dispatch wrapper publication
        env:
          VERSION: ${{ github.ref_name }}
          WRAPPER_REPOSITORY_TOKEN: ${{ secrets.VX_WRAPPER_REPOSITORY_TOKEN }}
        shell: bash
        run: |
          test -n "$WRAPPER_REPOSITORY_TOKEN"
          version="${VERSION#v}"
          curl --fail-with-body --request POST \
            --url https://api.github.com/repos/vx-rs/webfont-converter-node/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $WRAPPER_REPOSITORY_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"binaries-published\",\"client_payload\":{\"version\":\"$version\",\"binaryRepositoryTag\":\"v$version\"}}"
